# Translate Claude Code's Anthropic /v1/messages calls to the local MLX server (OpenAI format).
# Every model name Claude Code asks for (sonnet, haiku, ...) maps to the one local model.
model_list:
  - model_name: "*"
    litellm_params:
      model: hosted_vllm/default_model  # plain /v1/chat/completions (openai/ routes to /v1/responses, which MLX lacks)
      api_base: http://127.0.0.1:8080/v1
      api_key: local
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
litellm_settings:
  drop_params: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY  # random, generated by claude-local.sh

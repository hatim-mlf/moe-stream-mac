<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Qwen Chat</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e1dc; --accent:#3d5afe; --user:#eef1ff; --think:#f3f1ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --panel:#1c1c1f; --ink:#ececee; --muted:#9a9aa2; --line:#2c2c31; --accent:#8c9eff; --user:#23263a; --think:#222220; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system, system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  #status { font-size:13px; color:var(--muted); }
  #status.ok::before { content:"● "; color:#2e9d5b; } #status.err::before { content:"● "; color:#d64545; }
  header label { font-size:13px; color:var(--muted); margin-left:auto; display:flex; gap:6px; align-items:center; }
  header button { font:inherit; font-size:13px; padding:4px 10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:6px; cursor:pointer; }
  main { flex:1; overflow-y:auto; padding:16px; }
  .wrap { max-width:780px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .msg { padding:10px 14px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; }
  .user { background:var(--user); align-self:flex-end; max-width:85%; }
  .bot { background:var(--panel); border:1px solid var(--line); }
  .think { background:var(--think); color:var(--muted); font-size:13px; border-radius:8px; padding:8px 12px; margin-bottom:8px; white-space:pre-wrap; }
  .meta { font-size:12px; color:var(--muted); margin-top:6px; }
  .empty { color:var(--muted); text-align:center; margin-top:15vh; }
  form { border-top:1px solid var(--line); padding:12px 16px; }
  form .wrap { flex-direction:row; gap:8px; }
  textarea { flex:1; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); resize:none; min-height:46px; max-height:200px; }
  form button { font:inherit; padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>Local Qwen3.6-35B-A3B (MLX, 4-bit)</h1>
  <span id="status">connecting…</span>
  <label><input type="checkbox" id="thinking"> Thinking</label>
  <button id="clear" type="button">New chat</button>
</header>
<main id="log"><div class="wrap" id="msgs"><p class="empty">Runs entirely on this Mac. Ask anything.</p></div></main>
<form id="form"><div class="wrap">
  <textarea id="input" placeholder="Message the local model… (Enter to send, Shift+Enter for a new line)" rows="1"></textarea>
  <button id="send">Send</button>
</div></form>
<script>
const API = "http://127.0.0.1:8080/v1";
const msgsEl = document.getElementById("msgs"), logEl = document.getElementById("log");
const input = document.getElementById("input"), sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status"), thinkingBox = document.getElementById("thinking");
let history = [];

function setStatus(text, kind) { statusEl.textContent = text; statusEl.className = kind || ""; }

async function checkServer() {
  try {
    const r = await fetch(`${API}/models`);
    if (!r.ok) throw new Error(r.status);
    setStatus("server online", "ok");
  } catch { setStatus("server offline: run scripts/local/serve-mlx.sh", "err"); }
}

function addEl(cls, text) {
  msgsEl.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = `msg ${cls}`; el.textContent = text || "";
  msgsEl.appendChild(el); logEl.scrollTop = logEl.scrollHeight;
  return el;
}

async function send(text) {
  history = [...history, { role: "user", content: text }];
  addEl("user", text);
  const bot = addEl("bot");
  const think = document.createElement("div"), body = document.createElement("div"), meta = document.createElement("div");
  think.className = "think"; meta.className = "meta"; body.textContent = "…";
  bot.append(body, meta);

  const start = performance.now(); let firstAt = null, answer = "", reasoning = "", usage = null;
  try {
    const r = await fetch(`${API}/chat/completions`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "default_model", messages: history, max_tokens: 4096, stream: true,
        temperature: 0.7, stream_options: { include_usage: true },
        chat_template_kwargs: { enable_thinking: thinkingBox.checked } }),
    });
    if (!r.ok) throw new Error(`server returned ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:") || line.includes("[DONE]")) continue;
        const ev = JSON.parse(line.slice(5)); usage = ev.usage || usage;
        for (const c of ev.choices || []) {
          const d = c.delta || {};
          const r2 = d.reasoning || d.reasoning_content, t = d.content;
          if ((r2 || t) && firstAt === null) firstAt = performance.now();
          if (r2) { reasoning += r2; think.textContent = reasoning; if (!think.isConnected) bot.prepend(think); }
          if (t) { answer += t; body.textContent = answer; }
        }
      }
      logEl.scrollTop = logEl.scrollHeight;
    }
    if (!answer && !reasoning) body.textContent = "(empty reply)";
    history = [...history, { role: "assistant", content: answer }];
    const secs = (performance.now() - (firstAt ?? start)) / 1000, toks = usage?.completion_tokens;
    const ttft = firstAt ? ((firstAt - start) / 1000).toFixed(2) : "?";
    meta.textContent = toks ? `${toks} tokens · ${(toks / secs).toFixed(1)} tok/s · first token ${ttft}s` : `first token ${ttft}s`;
  } catch (e) {
    body.textContent = `Error: ${e.message}. Is the MLX server running on port 8080?`;
    history = history.slice(0, -1); checkServer();
  }
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault(); const text = input.value.trim(); if (!text || sendBtn.disabled) return;
  input.value = ""; sendBtn.disabled = true; await send(text); sendBtn.disabled = false; input.focus();
});
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); } });
document.getElementById("clear").addEventListener("click", () => { history = []; msgsEl.innerHTML = '<p class="empty">New chat. Ask anything.</p>'; });
checkServer(); input.focus();
</script>
</body>
</html>
